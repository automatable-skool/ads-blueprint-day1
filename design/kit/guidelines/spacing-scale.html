<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="Tight steps for text, generous steps for layout" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font:var(--type-body)}.bars{display:grid;gap:5px}.b{display:flex;align-items:center;gap:10px;font:var(--type-caption);color:var(--text-muted)}.b i{display:block;height:9px;background:var(--blue-600);border-radius:2px}.b.lay i{background:var(--accent-700)}.hd{font:var(--type-label);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-brand);margin:0 0 6px}.hd+.hd{margin-top:12px}</style></head><body>
<p class="hd">Text steps</p>
<div class="bars">
<div class="b"><i style="width:4px"></i>--space-2 · 4px</div><div class="b"><i style="width:8px"></i>--space-3 · 8px</div><div class="b"><i style="width:12px"></i>--space-4 · 12px</div><div class="b"><i style="width:16px"></i>--space-5 · 16px</div>
</div>
<p class="hd">Layout steps</p>
<div class="bars">
<div class="b lay"><i style="width:22px"></i>--space-6 · 22px</div><div class="b lay"><i style="width:28px"></i>--space-7 · 28px · card padding</div><div class="b lay"><i style="width:38px"></i>--space-8 · 38px</div><div class="b lay"><i style="width:48px"></i>--space-9 · 48px</div><div class="b lay"><i style="width:64px"></i>--space-10 · 64px</div><div class="b lay"><i style="width:84px"></i>--space-11 · 84px</div><div class="b lay"><i style="width:112px"></i>--space-12 · 112px · section</div><div class="b lay"><i style="width:152px"></i>--space-13 · 152px · section</div>
</div>
</body></html>
