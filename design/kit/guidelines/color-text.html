<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font:var(--type-body)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.b{padding:12px;border-radius:var(--radius-card);display:grid;gap:5px;font-size:15px}</style></head><body>
<div class="cols">
<div class="b" style="background:var(--surface-card);border:1px solid var(--line-hairline)">
<span style="color:var(--text-strong);font-weight:800">--text-strong · headings</span>
<span style="color:var(--text-body)">--text-body · paragraphs</span>
<span style="color:var(--text-muted)">--text-muted · captions, labels</span>
<span style="color:var(--text-brand);font-weight:700">--text-brand · links</span>
<span style="color:var(--text-accent);font-weight:700">--text-accent · accent-600 on white</span>
</div>
<div class="b" style="background:var(--surface-brand-deep)">
<span style="color:var(--text-inverse);font-weight:800">--text-inverse · on blue</span>
<span style="color:var(--blue-100)">--blue-100 · secondary on blue</span>
<span style="color:var(--blue-100);font-weight:700">--blue-100 · secondary on blue</span>
</div>
</div>
</body></html>
