<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font:var(--type-body)}</style></head><body>
<div style="display:flex;gap:var(--space-8);align-items:flex-start">
<div style="background:var(--surface-card);border:1px solid var(--line-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);padding:var(--pad-card);display:grid;gap:var(--gap-stack);width:280px">
<strong style="font:var(--type-h3)">Card</strong>
<span style="font:var(--type-body-sm);color:var(--text-muted)">padding: var(--pad-card) = 28px<br>gap: var(--gap-stack) = 22px</span>
<span style="height:var(--control-h);border:1px solid var(--line-strong);border-radius:var(--radius-control);display:flex;align-items:center;padding:0 16px;font:var(--type-body-sm);color:var(--text-faint)">control-h 42px</span>
</div>
<div style="font:var(--type-body-sm);color:var(--text-body);display:grid;gap:8px">
<span>--section-y · 152px between page sections</span>
<span>--section-y-sm · 112px, the common case</span>
<span>--gutter · 28px page inset</span>
<span>--container-max · 1200px</span>
<span>--container-text · 66ch measure</span>
</div>
</div>
</body></html>
