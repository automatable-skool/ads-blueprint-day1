<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font:var(--type-body)}.sw{display:flex;gap:0;border-radius:10px;overflow:hidden}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:7px 8px;font:var(--type-caption)}.k{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;font:var(--type-caption);color:var(--text-muted)}</style></head><body>
<div class="sw">
<div style="background:var(--ink-900);color:#fff">900 #0B1C33</div>
<div style="background:var(--ink-700);color:#fff">700 #2F4460</div>
<div style="background:var(--ink-500);color:#fff">500 #647990</div>
<div style="background:var(--ink-300);color:var(--ink-900)">300 #C0CBD9</div>
<div style="background:var(--ink-200);color:var(--ink-900)">200 #E0E8F1</div>
<div style="background:var(--ink-100);color:var(--ink-900)">100 #EEF3F9</div>
<div style="background:var(--ink-50);color:var(--ink-900)">50 #F7FAFD</div>
<div style="background:var(--white);color:var(--ink-900);box-shadow:inset 0 0 0 1px var(--ink-200)">#FFF page</div>
</div><div class="k"><span>--ink-200 = hairline</span><span>--ink-100 = sunken</span><span>--ink-900 = strong text</span></div>
</body></html>
