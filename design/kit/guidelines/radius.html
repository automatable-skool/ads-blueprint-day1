<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font:var(--type-body)}.row{display:flex;gap:16px;align-items:flex-end}.r{width:100px;height:70px;background:var(--surface-card);border:1px solid var(--line-strong);display:grid;place-items:center;font:var(--type-caption);color:var(--text-muted);text-align:center}</style></head><body>
<div class="row">
<div class="r" style="border-radius:var(--radius-xs)">xs 4px<br>checkbox</div>
<div class="r" style="border-radius:var(--radius-sm)">sm 8px<br>inputs</div>
<div class="r" style="border-radius:var(--radius-control)">control 10px<br>buttons &amp; inputs</div>
<div class="r" style="border-radius:var(--radius-lg)">lg 16px<br>cards</div>
<div class="r" style="border-radius:var(--radius-xl)">xl 20px<br>media</div>
<div class="r" style="border-radius:var(--radius-pill);width:120px;height:34px">pill · badges only</div>
</div>
</body></html>
