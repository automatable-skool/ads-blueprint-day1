<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="Positive, caution, critical, info — with tinted backgrounds" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font:var(--type-body)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.chip{border-radius:var(--radius-card);padding:12px;font:var(--type-body-sm)}</style></head><body>
<div class="row">
<div class="chip" style="background:var(--status-positive-bg);color:var(--status-positive);border:1px solid var(--status-positive)"><strong>Positive</strong><br>#0D9668 on #E6F6F0</div>
<div class="chip" style="background:var(--status-caution-bg);color:var(--status-caution);border:1px solid var(--status-caution)"><strong>Caution</strong><br>#C26F09 on #FDF3E6</div>
<div class="chip" style="background:var(--status-critical-bg);color:var(--status-critical);border:1px solid var(--status-critical)"><strong>Critical</strong><br>#D93A2F on #FDEDEC</div>
<div class="chip" style="background:var(--status-info-bg);color:var(--status-info);border:1px solid var(--status-info)"><strong>Info</strong><br>#0A7CFF on #E8F2FF</div>
</div>
</body></html>
