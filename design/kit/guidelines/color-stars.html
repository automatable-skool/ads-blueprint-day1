<!-- @dsCard group="Colors" viewport="700x140" name="Rating stars" subtitle="Own tokens — brand blue on light, white on blue" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font:var(--type-body)}.row{display:flex;gap:16px;align-items:stretch}.box{flex:1;padding:14px;border-radius:var(--radius-card);display:grid;gap:9px}.stars{display:flex;gap:3px}.stars img{width:19px;height:19px}.k{font:var(--type-caption);color:var(--text-muted)}</style></head><body>
<div class="row">
<div class="box" style="background:var(--surface-card);border:1px solid var(--line-hairline)">
<div class="stars"><img src="../assets/icons/star.svg" alt=""><img src="../assets/icons/star.svg" alt=""><img src="../assets/icons/star.svg" alt=""><img src="../assets/icons/star.svg" alt=""><img src="../assets/icons/star.svg" alt=""></div>
<strong style="font:var(--weight-bold) var(--size-body-sm)/1 var(--font-core);color:var(--text-strong)">4.9 · 2,500 reviews</strong>
<span class="k">--star-filled = --blue-600 · 5.6:1 on white</span>
</div>
<div class="box" style="background:var(--surface-brand)">
<div class="stars" style="filter:brightness(0) invert(1)"><img src="../assets/icons/star.svg" alt=""><img src="../assets/icons/star.svg" alt=""><img src="../assets/icons/star.svg" alt=""><img src="../assets/icons/star.svg" alt=""><img src="../assets/icons/star.svg" alt=""></div>
<strong style="font:var(--weight-bold) var(--size-body-sm)/1 var(--font-core);color:var(--white)">4.9 · 2,500 reviews</strong>
<span class="k" style="color:var(--blue-100)">--star-on-brand = white · tone="on-brand"</span>
</div>
</div>
<div class="k" style="margin-top:12px">Stars never use the accent — teal is too light to read on white. Empty stars are --star-empty (--ink-300), or 42% white on a blue band.</div>
</body></html>
