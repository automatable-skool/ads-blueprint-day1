<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head><body><div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel" src="BookingFlow.jsx"></script>
<script type="text/babel">
const { Toast } = window.GoodworkDesignSystem_fee824;
function Site(){
  const [route,setRoute]=React.useState("home");
  const [booking,setBooking]=React.useState(false);
  const [toast,setToast]=React.useState(null);
  return (<React.Fragment>
    <SiteHeader route={route} onNavigate={setRoute} onBook={()=>setBooking(true)}/>
    <main>
      <Hero onBook={()=>setBooking(true)}/>
      <Proof/>
      <Services onBook={()=>setBooking(true)}/>
      <Process/>
      <Gallery/>
      <Crew/>
      <Club onBook={()=>setBooking(true)}/>
      <Areas/>
      <Reviews/>
      <Questions/>
      <ClosingCTA onBook={()=>setBooking(true)}/>
    </main>
    <SiteFooter/>
    <BookingFlow open={booking} onClose={()=>setBooking(false)} onDone={(when)=>{setBooking(false);setToast("Booked — Thursday 20 Aug, "+when.toLowerCase()+". We'll text to confirm.");}}/>
    {toast ? <div className="toastwrap"><Toast message={toast} onClose={()=>setToast(null)}/></div> : null}
  </React.Fragment>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Site/>);
</script></body></html>
