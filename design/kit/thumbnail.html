<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Goodwork</title><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 168px}
.mark{background:var(--blue-700);display:grid;place-items:center;padding:0 60px}
.mark span{font:var(--weight-black) 176px/1 var(--font-core);letter-spacing:-0.04em;color:var(--white);white-space:nowrap}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style>
</head><body>
<div class="tile">
<div class="mark"><span>Goodwork</span></div>
<div class="strip"><div style="background:var(--blue-100)"></div><div style="background:var(--accent-800)"></div><div style="background:var(--blue-500)"></div><div style="background:var(--blue-900)"></div></div>
</div>
</body></html>
