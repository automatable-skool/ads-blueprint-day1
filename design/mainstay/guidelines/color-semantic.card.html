<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}.row{display:flex;gap:0;border-radius:10px;overflow:hidden}.sw{flex:1;height:74px;display:flex;align-items:flex-end;padding:8px;font:600 11px/1 var(--font-core)}.cap{display:flex;gap:0;margin-top:8px}.cap div{flex:1;font:500 11px/1.4 var(--font-core);color:var(--text-muted);padding-left:8px}</style></head><body>
<div class="row"><div class="sw" style="background:var(--status-success);color:#fff">success</div><div class="sw" style="background:var(--status-warning);color:#fff">warning</div><div class="sw" style="background:var(--status-danger);color:#fff">danger</div><div class="sw" style="background:var(--status-info);color:#fff">info</div></div>
<div class="cap"><div>--status-success</div><div>--status-warning</div><div>--status-danger</div><div>--status-info</div></div>
</body></html>
