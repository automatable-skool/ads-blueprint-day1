<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}.row{display:flex;gap:0;border-radius:10px;overflow:hidden}.sw{flex:1;height:74px;display:flex;align-items:flex-end;padding:8px;font:600 11px/1 var(--font-core)}.cap{display:flex;gap:0;margin-top:8px}.cap div{flex:1;font:500 11px/1.4 var(--font-core);color:var(--text-muted);padding-left:8px}</style></head><body>
<div class="row"><div class="sw" style="background:var(--accent-50);color:var(--accent-800)">50</div><div class="sw" style="background:var(--accent-100);color:var(--accent-800)">100</div><div class="sw" style="background:var(--accent-200);color:var(--accent-800)">200</div><div class="sw" style="background:var(--accent-300);color:var(--accent-800)">300</div><div class="sw" style="background:var(--accent-400);color:#fff">400</div><div class="sw" style="background:var(--accent-500);color:#fff">500</div><div class="sw" style="background:var(--accent-600);color:#fff">600</div><div class="sw" style="background:var(--accent-700);color:#fff">700</div><div class="sw" style="background:var(--accent-800);color:#fff">800</div></div>
<div class="cap"><div>--accent-50</div><div>--accent-100</div><div>--accent-200</div><div>--accent-300</div><div>--accent-400</div><div>--accent-500</div><div>--accent-600</div><div>--accent-700</div><div>--accent-800</div></div>
</body></html>
