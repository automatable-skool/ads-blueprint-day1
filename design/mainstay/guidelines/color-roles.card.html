<!-- @dsCard group="Colors" viewport="700x190" name="Surface & text roles" subtitle="Semantic aliases every component reads from." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
<div style="background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:10px;padding:14px"><div style="font:600 13px/1 var(--font-core);color:var(--text-strong)">--surface-page</div><div style="font:400 12px/1.5 var(--font-core);color:var(--text-body);margin-top:6px">--text-strong / --text-body</div></div>
<div style="background:var(--surface-sunken);border-radius:10px;padding:14px"><div style="font:600 13px/1 var(--font-core);color:var(--text-strong)">--surface-sunken</div><div style="font:400 12px/1.5 var(--font-core);color:var(--text-muted);margin-top:6px">--text-muted</div></div>
<div style="background:var(--surface-accent-soft);border:1px solid var(--accent-100);border-radius:10px;padding:14px"><div style="font:600 13px/1 var(--font-core);color:var(--accent-700)">--surface-accent-soft</div><div style="font:400 12px/1.5 var(--font-core);color:var(--text-accent);margin-top:6px">--text-accent</div></div>
<div style="background:var(--surface-inverse);border-radius:10px;padding:14px"><div style="font:600 13px/1 var(--font-core);color:var(--text-inverse)">--surface-inverse</div><div style="font:400 12px/1.5 var(--font-core);color:rgba(255,255,255,.66);margin-top:6px">--text-inverse</div></div>
</div>
</body></html>
