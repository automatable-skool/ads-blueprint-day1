<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}.row{display:flex;gap:0;border-radius:10px;overflow:hidden}.sw{flex:1;height:74px;display:flex;align-items:flex-end;padding:8px;font:600 11px/1 var(--font-core)}.cap{display:flex;gap:0;margin-top:8px}.cap div{flex:1;font:500 11px/1.4 var(--font-core);color:var(--text-muted);padding-left:8px}</style></head><body>
<div class="row"><div class="sw" style="background:var(--n-0);color:var(--n-900);box-shadow:inset 0 0 0 1px var(--n-200)">0</div><div class="sw" style="background:var(--n-50);color:var(--n-900);">50</div><div class="sw" style="background:var(--n-100);color:var(--n-900);">100</div><div class="sw" style="background:var(--n-200);color:var(--n-900);">200</div><div class="sw" style="background:var(--n-300);color:var(--n-900);">300</div><div class="sw" style="background:var(--n-400);color:var(--n-900);">400</div><div class="sw" style="background:var(--n-500);color:#fff;">500</div><div class="sw" style="background:var(--n-600);color:#fff;">600</div><div class="sw" style="background:var(--n-700);color:#fff;">700</div><div class="sw" style="background:var(--n-800);color:#fff;">800</div><div class="sw" style="background:var(--n-900);color:#fff;">900</div><div class="sw" style="background:var(--n-950);color:#fff;">950</div></div>
<div class="cap"><div>0</div><div>50</div><div>100</div><div>200</div><div>300</div><div>400</div><div>500</div><div>600</div><div>700</div><div>800</div><div>900</div><div>950</div></div>
</body></html>
