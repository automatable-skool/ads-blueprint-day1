<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mainstay — local service website kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ServicesScreen.jsx"></script>
<script type="text/babel" src="PricingScreen.jsx"></script>
<script type="text/babel" src="ContactScreen.jsx"></script>
<script type="text/babel">
const { SiteHeader, SiteFooter } = window.MainstayDesignSystem_eaeaf9;
const LINKS = [{label:'Services',href:'#services'},{label:'Pricing',href:'#pricing'},{label:'Reviews',href:'#reviews'},{label:'Contact',href:'#contact'}];

function App(){
  const [route,setRoute]=React.useState('#home');
  const go=(href)=>{ setRoute(href==='#reviews'?'#home':href); window.scrollTo({top:0}); };
  const Screen = route==='#services'?ServicesScreen : route==='#pricing'?PricingScreen : route==='#contact'?ContactScreen : HomeScreen;
  return (<React.Fragment>
    <SiteHeader brand="Main" brandAccent="stay" links={LINKS} activeHref={route} onNavigate={go} onCta={()=>go('#contact')} />
    <Screen go={go} />
    <SiteFooter brand="Main" brandAccent="stay" columns={[
      {title:'Services',links:[{label:'Plumbing'},{label:'Heating & boilers'},{label:'Electrical'},{label:'Carpentry'},{label:'Decorating'}]},
      {title:'Company',links:[{label:'About us'},{label:'Our engineers'},{label:'Reviews'},{label:'Careers'},{label:'Complaints'}]},
      {title:'Areas',links:[{label:'Ashbourne'},{label:'Redhill'},{label:'Carlow'},{label:'Kingsmoor'},{label:'Peveril'}]}]}
      licence="Gas Safe 448201 · NICEIC approved" />
  </React.Fragment>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
